## bridge-cp-conductor

  - name: bridge-cp-conductor
    enabled: true
    # Which secret layers this service receives via envFrom (see the
    # secrets section at the top). Each is on unless set to false here.
    secrets:
      tenantCommon: true    # layer 1 (tenantcommonSecrets)
      serviceCommon: true   # layer 2 (servicecommonSecrets)
      service: true       # layer 3: this service's own secret (serviceSecrets)
    image:
      repository: iad.ocir.io/hbssoc/bridge-cp-conductor
      tag: 'latest'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 8461
    env: {}
    # Env vars whose value is looked up from ANOTHER service in this chart
    # (its in-cluster Service name for `host`, its first container port for
    # `port`) -- no Vault entry needed. Rendered under `env:`, which wins
    # over the envFrom secrets, so this overrides any REDIS_HOST/REDIS_PORT
    # coming from service-common. The referenced service must exist and be
    # enabled, otherwise the render fails.
    serviceRefEnv:
      REDIS_HOST:
        service: bridge-cp-conductor-redis
        field: host
      REDIS_PORT:
        service: bridge-cp-conductor-redis
        field: port
    portEnv:
    - API_PORT
    ingressPath: /controlopsv2/api/
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    persistence:
    - type: pvc
      name: bridge-cp-redis-dispatcher
      mountPath: /opt/bridge-cp-redis/dispatcher
      readOnly: false
    - type: pvc
      name: bridge-cp-wtl-sr-instances
      mountPath: /opt/bridge-cp-wtl/sr-instances
      readOnly: false
    - type: pvc
      name: bridge-cp-redis-data
      mountPath: /data
      readOnly: false      
    # /var/run/docker.sock hostPath mount removed here — grants de-facto
    # root on the node with no safe Kubernetes analog. Unlike erep-server,
    # bridge-cp-conductor has no on-demand Kubernetes-API replacement wired
    # up (nothing here observed it actually spawning sibling containers at
    # request time) — it still shares the tenant ServiceAccount (see
    # templates/rbac.yaml) if that need shows up later.
    - type: hostPath
      path: /vault/secrets
      mountPath: /vault/secrets
      readOnly: true
  - name: bridge-cp-conductor-redis
    enabled: true
    # Which secret layers this service receives via envFrom (see the
    # secrets section at the top). Each is on unless set to false here.
    secrets:
      tenantCommon: true    # layer 1 (tenantcommonSecrets)
      serviceCommon: true   # layer 2 (servicecommonSecrets)
      service: true       # layer 3: this service's own secret (serviceSecrets)
    image:
      repository: iad.ocir.io/hbssoc/bridge-cp-redis
      tag: 'stg'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 6379
    env: {}
    # Health checks translated from the docker-compose healthcheck of the same
    # app. Optional `probes:` takes raw Kubernetes probe specs under
    # startupProbe / readinessProbe / livenessProbe. Readiness (and startup)
    # only: a failing check stops traffic to the pod but does not restart it.
    probes:
      startupProbe:        # compose start_period: 15s
        exec:
          command: [redis-cli, -p, "6379", ping]
        periodSeconds: 5
        failureThreshold: 3
      readinessProbe:
        exec:
          command: [redis-cli, -p, "6379", ping]
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
    ingressPath: null
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    persistence:
    - type: pvc
      name: bridge-cp-wtl-sr-instances
      mountPath: /opt/bridge-cp-wtl/sr-instances
      readOnly: false
    - type: pvc
      name: bridge-cp-redis-data
      mountPath: /data
      readOnly: false
    - type: pvc
      name: bridge-cp-redis-dispatcher
      mountPath: /opt/bridge-cp-redis/dispatcher
      readOnly: false

##Bridge
      
  - name: bridge
    enabled: true
    # Which secret layers this service receives via envFrom (see the
    # secrets section at the top). Each is on unless set to false here.
    secrets:
      tenantCommon: true    # layer 1 (tenantcommonSecrets)
      serviceCommon: true   # layer 2 (servicecommonSecrets)
      service: true       # layer 3: this service's own secret (serviceSecrets)
    image:
      repository: iad.ocir.io/hbssoc/acetaxi-bridge
      tag: 'stg'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 16004
    env: {}
    # Reference example (see templates/deployment.yaml): NODE_ENV isn't
    # actually sensitive, so it's sourced straight from this file instead
    # of Vault -- change it here via a normal PR, no Vault CLI needed.
    plainEnv:
      NODE_ENV: production
    portEnv:
    - PORT
    - VIRTUAL_PORT
    - API_PORT
    ingressPath: /
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    persistence:
    - type: hostPath
      path: /vault/secrets
      mountPath: /vault/secrets
      readOnly: true

