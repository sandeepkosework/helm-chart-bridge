nameOverride: tenant-app
# Placeholders — every real deployment MUST override tenant.* via a
# per-tenant values file (see examples/). Left unset-looking on purpose so
# an accidental `helm install` without -f fails loudly instead of silently
# reusing another tenant's identity.
tenant:
  id: changeme
  name: changeme
  namespace: changeme
  domain: changeme.qraie.ai
imagePullSecrets:
- ocir-registry
storage:
  createStorageClass: true
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
ingress:
  enabled: true
  className: nginx
  annotations: {}
  tls:
    enabled: false
    secretName: ''
# Vault connection for this tenant's own SecretStore (templates/secretstore.yaml)
# -- one namespaced SecretStore per tenant release, authenticating via
# Kubernetes auth with a namespace-label-selector-bound role, rather than a
# single cluster-wide ClusterSecretStore + static token. This is what lets a
# brand-new tenant namespace authenticate to Vault with zero manual `vault
# write` step beyond the one-time cluster setup (see doc). The Argo CD
# ApplicationSet deploying this chart must stamp `vault.namespaceLabel`'s
# key/value (see below) onto the tenant namespace via
# syncPolicy.managedNamespaceMetadata.labels for the role's selector to match.
vault:
  server: http://vault.vault.svc:8200
  path: secret
  version: v2
  mountPath: kubernetes
  role: qraie-bridge
  namespaceLabel:
    key: qraie-bridge-tenant
    value: "true"
# Org-wide secrets shared by every tenant (e.g. shared Redis/Mongo host,
# third-party API keys used in common) -- ONE Vault path, ONE K8s Secret
# per tenant namespace, and every service pulls it in bulk via envFrom
# (see deployment.yaml) alongside its own per-service secret. Unlike
# serviceSecrets below (written once per tenant at creation time), this
# path is NOT tenant-scoped and nothing copies it -- every tenant's
# common-secret ExternalSecret reads the exact same Vault path live, so an
# update here reaches every tenant on its next refresh, without needing a
# per-tenant write. Populate secret/k8s/tenant-common manually; nothing
# writes to it automatically.
commonSecrets:
  enabled: true
  secretName: common-secret
  remotePath: secret/k8s/tenant-common
  refreshInterval: 1h
# Values shared across all of THIS tenant's own services, but not with
# other tenants (e.g. this tenant's own Redis host/password) -- unlike
# commonSecrets above, tenant-operator DOES write here per tenant, at
# secret/tenants/<tenant.id>/common (see write_initial_qraie_bridge_tenant_secrets's
# "common" entry), same timing as every other per-service secret.
tenantSecrets:
  enabled: true
  secretName: tenant-secret
  remotePath: ""
  refreshInterval: 1h
# Secrets scoped to a single service of a single tenant. Generated
# automatically for any service whose env has secret-ref (map) values, from
# Vault path secret/tenants/<tenant.id>/<service> — this is the default an
# env var falls back to when it omits `secretName` entirely.
serviceSecrets:
  enabled: true
  refreshInterval: 1h
persistence:
  bridge-cp-wtl-sr-instances:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  redis-data:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  # Dedicated PVCs for qraie-redis-shared/qraie-redis -- deliberately NOT
  # reusing redis-data above, which already belongs to
  # bridge-cp-conductor-redis: two separate Deployments (separate pods)
  # both claiming the same PVC name would fight over one ReadWriteOnce
  # volume, unlike the same PVC being mounted twice within ONE pod (which
  # templates/deployment.yaml already dedupes safely).
  qraie-redis-shared-data:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  qraie-redis-data:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  erep-generated:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  erep-logs:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  qraie-attachments:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  iot-vlm-deepface:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  iot-vlm-db:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  prism-videos:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  voxflow-agents:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  voxflow-mcp:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  radicale-data:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
# Listing a service's name here disables it regardless of its own
# `enabled: true` in the services[] entry above -- disabledServices always
# wins over a service's own enabled flag, never the other way around.
disabledServices: []
services:
  - name: qraie-redis-shared
    enabled: true
    image:
      repository: redis
      tag: '7'
      pullPolicy: IfNotPresent
    replicas: 2
    ports:
    - containerPort: 6379
    # Every other service that talks to this instance sends REDIS_PASSWORD —
    # the real docker-compose enforces it via `redis-server --requirepass`,
    # which the chart never carried over (this Deployment ran with no auth
    # at all). command uses the Kubernetes $(VAR) env-substitution syntax,
    # so REDIS_PASSWORD below must come from the same secret every client
    # already reads, not a separately-managed value.
    command:
    - redis-server
    - --requirepass
    - $(REDIS_PASSWORD)
    env: {}
    ingressPath: null
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: pvc
      name: qraie-redis-shared-data
      mountPath: /data
      readOnly: false
  - name: qraie-redis
    enabled: true
    image:
      repository: redislabs/redisgears
      tag: 1.2.5
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 6379
    env: {}
    ingressPath: null
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: pvc
      name: qraie-redis-data
      mountPath: /data
      readOnly: false
  - name: bridge-cp-conductor
    enabled: true
    image:
      repository: nginx
      tag: 'latest'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 8461
    env: {}
    ingressPath: /controlopsv2/api/
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: hostPath
      path: /opt/bridge-cp-redis/dispatcher
      mountPath: /opt/bridge-cp-redis/dispatcher
      readOnly: false
    - type: pvc
      name: bridge-cp-wtl-sr-instances
      mountPath: /opt/bridge-cp-wtl/sr-instances
      readOnly: false
    # /var/run/docker.sock hostPath mount removed here — grants de-facto
    # root on the node with no safe Kubernetes analog. Unlike erep-server,
    # bridge-cp-conductor has no on-demand Kubernetes-API replacement wired
    # up (nothing here observed it actually spawning sibling containers at
    # request time) — it still shares the tenant ServiceAccount (see
    # templates/rbac.yaml) if that need shows up later.
    - type: hostPath
      path: /vault/secrets
      mountPath: /vault/secrets
      readOnly: true
  - name: bridge-cp-conductor-redis
    enabled: true
    image:
      repository: redis
      tag: '7'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 6379
    env: {}
    ingressPath: null
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: pvc
      name: bridge-cp-wtl-sr-instances
      mountPath: /opt/bridge-cp-wtl/sr-instances
      readOnly: false
    - type: pvc
      name: redis-data
      mountPath: /data
      readOnly: false
    - type: hostPath
      path: /opt/bridge-cp-redis/dispatcher
      mountPath: /opt/bridge-cp-redis/dispatcher
      readOnly: false
  - name: bridge
    enabled: true
    image:
      repository: nginx
      tag: 'latest'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 30170
    env: {}
    # Reference example (see templates/deployment.yaml): NODE_ENV isn't
    # actually sensitive, so it's sourced straight from this file instead
    # of Vault -- change it here via a normal PR, no Vault CLI needed.
    plainEnv:
      NODE_ENV: production
    ingressPath: /
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      # Temporarily lowered from 70 to 30 to make HPA easier to trigger for
      # manual load-testing -- revert to 70 once that testing is done.
      targetCPUUtilizationPercentage: 30
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: hostPath
      path: /vault/secrets
      mountPath: /vault/secrets
      readOnly: true
