nameOverride: tenant-app
# Placeholders — every real deployment MUST override tenant.* via a
# per-tenant values file (see examples/). Left unset-looking on purpose so
# an accidental `helm install` without -f fails loudly instead of silently
# reusing another tenant's identity.
tenant:
  id: changeme
  name: changeme
  namespace: changeme
  domain: changeme.qraie.ai
imagePullSecrets:
- ocir-registry
storage:
  createStorageClass: true
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
ingress:
  enabled: true
  className: nginx
  annotations: {}
  tls:
    enabled: false
    secretName: ''
# Vault connection for this tenant's own SecretStore (templates/secretstore.yaml)
# -- one namespaced SecretStore per tenant release, authenticating via
# Kubernetes auth with a namespace-label-selector-bound role, rather than a
# single cluster-wide ClusterSecretStore + static token. This is what lets a
# brand-new tenant namespace authenticate to Vault with zero manual `vault
# write` step beyond the one-time cluster setup (see doc). The Argo CD
# ApplicationSet deploying this chart must stamp `vault.namespaceLabel`'s
# key/value (see below) onto the tenant namespace via
# syncPolicy.managedNamespaceMetadata.labels for the role's selector to match.
vault:
  server: http://vault.vault.svc:8200
  path: secret
  version: v2
  mountPath: kubernetes
  role: qraie-bridge
  namespaceLabel:
    key: qraie-bridge-tenant
    value: "true"
# Org-wide secrets shared by every tenant (e.g. third-party API keys used
# in common). Disabled by default -- every service's env now always reads
# from its own fixed per-service Vault path (see serviceSecrets below); no
# per-key redirect to a shared secret exists anymore (removed along with
# the services: map -> list conversion, since Helm can no longer deep-merge
# a per-tenant override onto a list). Only enable this if something is
# actually wired to read from it.
commonSecrets:
  enabled: false
  secretName: common-secrets
  remotePath: secret/common
  refreshInterval: 1h
# Secrets shared across all of one tenant's services but not shared with
# other tenants. Disabled by default for the same reason as commonSecrets
# above -- nothing references it now that per-key secretName redirects are
# gone.
tenantSecrets:
  enabled: false
  secretName: tenant-secrets
  remotePath: ""
  refreshInterval: 1h
# Secrets scoped to a single service of a single tenant. Generated
# automatically for any service whose env has secret-ref (map) values, from
# Vault path secret/tenants/<tenant.id>/<service> — this is the default an
# env var falls back to when it omits `secretName` entirely.
serviceSecrets:
  enabled: true
  refreshInterval: 1h
persistence:
  bridge-cp-wtl-sr-instances:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  redis-data:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  erep-generated:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  erep-logs:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  qraie-attachments:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  iot-vlm-deepface:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  iot-vlm-db:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  prism-videos:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  voxflow-agents:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  voxflow-mcp:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  radicale-data:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
disabledServices: []
services:
  - name: qraie-redis-shared
    enabled: true
    image:
      repository: redis
      tag: '7'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - name: p0
      containerPort: 6379
    # Every other service that talks to this instance sends REDIS_PASSWORD —
    # the real docker-compose enforces it via `redis-server --requirepass`,
    # which the chart never carried over (this Deployment ran with no auth
    # at all). command uses the Kubernetes $(VAR) env-substitution syntax,
    # so REDIS_PASSWORD below must come from the same secret every client
    # already reads, not a separately-managed value.
    command:
    - redis-server
    - --requirepass
    - $(REDIS_PASSWORD)
    env:
      REDIS_PASSWORD:
        secretKey: REDIS_PASSWORD
    ingressPath: null
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence: []
  - name: qraie-redis
    enabled: true
    image:
      repository: redislabs/redisgears
      tag: 1.2.5
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - name: p0
      containerPort: 6379
    env: {}
    ingressPath: null
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence: []
  - name: bridge-cp-conductor
    enabled: true
    image:
      repository: nginx
      tag: 'latest'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - name: p0
      containerPort: 8461
    env:
      VIRTUAL_HOST: tg.qraie.
      VIRTUAL_PATH: /contpi/
      VIRTUAL_PORT: '8461'
      VIRTUAL_DEST: /
      API_PORT: '8461'
      REDIS_HOST: "{{ .Values.tenant.id }}-bridge-cp-conductor-redis"
      REDIS_PORT: '6379'
      REDIS_PASSWORD:
        secretKey: REDIS_PASSWORD
      REDIS_CONTAINER: protois
      REDIS_DISPATCHER_PATH: /opt/bridge-cp-redis/dispatcher/master_dispatcher.py
      SR_BASE_PATH: /opt/bridge-cp-wtl/sr-instances
      SR_NAME: "bridge-cp-{{ .Values.tenant.id }}-sr"
      GEMINI_MODEL: gemini-3-flash-preview
      WORKPLACE_DM_SOCKET_URL: https://protot
      WORKPLACE_DM_CLIENT_ID: QraieBot
      WORKPLACE_DM_PASSWORD:
        secretKey: WORKPLACE_DM_PASSWORD
      NOTIF_ENG_BASE_URL: https://stagin
    ingressPath: /controlopsv2/api/
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: hostPath
      path: /opt/bridge-cp-redis/dispatcher
      mountPath: /opt/bridge-cp-redis/dispatcher
      readOnly: false
    - type: pvc
      name: bridge-cp-wtl-sr-instances
      mountPath: /opt/bridge-cp-wtl/sr-instances
      readOnly: false
    # /var/run/docker.sock hostPath mount removed here — grants de-facto
    # root on the node with no safe Kubernetes analog. Unlike erep-server,
    # bridge-cp-conductor has no on-demand Kubernetes-API replacement wired
    # up (nothing here observed it actually spawning sibling containers at
    # request time) — it still shares the tenant ServiceAccount (see
    # templates/rbac.yaml) if that need shows up later.
    - type: hostPath
      path: /vault/secrets
      mountPath: /vault/secrets
      readOnly: true
  - name: bridge-cp-conductor-redis
    enabled: true
    image:
      repository: redis
      tag: '7'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - name: p0
      containerPort: 6379
    env: {}
    ingressPath: null
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: pvc
      name: bridge-cp-wtl-sr-instances
      mountPath: /opt/bridge-cp-wtl/sr-instances
      readOnly: false
    - type: pvc
      name: redis-data
      mountPath: /data
      readOnly: false
    - type: hostPath
      path: /opt/bridge-cp-redis/dispatcher
      mountPath: /opt/bridge-cp-redis/dispatcher
      readOnly: false
  - name: bridge
    enabled: true
    image:
      repository: nginx
      tag: 'latest'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - name: p0
      containerPort: 30170
    env:
      REDIS_HOST: "{{ .Values.tenant.id }}-qraie-redis-shared"
      REDIS_PORT: '30168'
      REDIS_PASSWORD:
        secretKey: REDIS_PASSWORD
      GLOBALAPIBASEURL: http://192.168.85.194:10
      ACTIVE_COLOR: ''
      START_PORT: '30166'
      VIRTUAL_HOST: "{{ .Values.tenant.domain }}"
      VIRTUAL_PORT: '30170'
      VIRTUAL_PATH: /
      PORT: '30170'
      NODE_ENV: production
      GEMINI_MODEL: gemini-3.1-pro-preview
    ingressPath: /
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: hostPath
      path: /vault/secrets
      mountPath: /vault/secrets
      readOnly: true
  - name: controlops-server
    enabled: true
    image:
      repository: nginx
      tag: 'latest'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - name: p0
      containerPort: 30172
    env:
      VIRTUAL_HOST: "{{ .Values.tenant.domain }}"
      VIRTUAL_PATH: /controlops/api/
      VIRTUAL_PORT: '30172'
      VIRTUAL_DEST: /
      REDIS_HOST: "{{ .Values.tenant.id }}-qraie-redis"
      REDIS_PORT: '6379'
      GLOBALAPIBASEURL: https://qraie_ai-b.qryde.n
      API_PORT: '30172'
      # controlops-server is a SQL Server (MSSQL) consumer, not Postgres —
      # confirmed by its real docker-compose using DB_USER: sa and the
      # classic MSSQL default port 1433. One shared in-cluster MSSQL
      # instance (data namespace) hosts one database per tenant, matching
      # the postgres/mongodb pattern already used for other shared DBs.
      DB_HOST: mssql.data.svc.cluster.local
      DB_USER:
        secretKey: DB_USER
      DB_PASSWORD:
        secretKey: DB_PASSWORD
      DB_NAME: "{{ .Values.tenant.id }}"
      MONGODB_URI:
        secretKey: MONGODB_URI
    ingressPath: /controlops/api/
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence: []
  - name: erep-server
    enabled: true
    image:
      repository: nginx
      tag: 'latest'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - name: p0
      containerPort: 30174
    env:
      # erep-pod-configmap.yaml (the on-demand erep Pod spawned via the
      # Kubernetes API) ranges directly over this env map — it does not go
      # through deployment.yaml's TENANT_ID auto-inject fallback, so
      # TENANT_ID has to be set explicitly here for the spawned Pod to get it.
      TENANT_ID: '{{ .Values.tenant.id | upper }}'
      REDIS_HOST: "{{ .Values.tenant.id }}-qraie-redis-shared"
      REDIS_PORT: '30168'
      REDIS_PASSWORD:
        secretKey: REDIS_PASSWORD
      GLOBALAPIBASEURL: https://qraie_ai-b.qryde.n
      ACTIVE_COLOR: ''
      START_PORT: '30166'
      VIRTUAL_HOST: "{{ .Values.tenant.domain }}"
      VIRTUAL_PATH: /galaxy/erepapi/
      VIRTUAL_DEST: /
      VIRTUAL_PORT: '30174'
      PORT: '30174'
      NODE_ENV: production
      BASE_URL: https://qraie_ai-b.qryde.n
      MONGODB_URI:
        secretKey: MONGODB_URI
      # Was 'true' when docker.sock was mounted below — erep-server no
      # longer talks to Docker directly, it creates erep Pods via the
      # Kubernetes API instead (see the configMap persistence entry below
      # and templates/erep-pod-configmap.yaml).
      DOCKER_ENABLED: 'false'
      LOG_LEVEL: info
    ingressPath: /galaxy/erepapi/
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
    persistence:
    - type: pvc
      name: erep-generated
      mountPath: /app/generated-ereps
      readOnly: false
    - type: pvc
      name: erep-logs
      mountPath: /app/logs
      readOnly: false
    # /var/run/docker.sock hostPath mount removed here — replaced by the
    # erep-pod-template ConfigMap below (see templates/erep-pod-configmap.yaml
    # and templates/rbac.yaml's "create" verb). erep-server reads the
    # mounted erep-pod.yaml and creates one-off erep Pods via the Kubernetes
    # API instead of talking to Docker directly.
    - type: configMap
      name: erep-pod-template
      mountPath: /etc/erep-pod-template
      readOnly: true
