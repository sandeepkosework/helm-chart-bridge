    # only: a failing check stops traffic to the pod but does not restart it.
    # `port` must be the port the app really listens on (its PORT env, 28055
    # in compose); this chart's containerPort for it is 3003.
    probes:
      readinessProbe:
        httpGet:
          path: /
          port: 3003
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
    portEnv:
    - PORT
    - VIRTUAL_PORT
    - API_PORT
    ingressPath: /enrollment/
    ingressRewriteTo: "/"
    # Shared Redis (qraie-redis-shared): host and port come from the chart,
    # not Vault. Only REDIS_PASSWORD stays in Vault (service-common).
    serviceRefEnv:
      REDIS_HOST:
        service: qraie-redis-shared
        field: host
      REDIS_PORT:
        service: qraie-redis-shared
        field: port
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    persistence:
    - type: pvc
      name: iot-vlm-deepface
      mountPath: /root/.deepface
      readOnly: false
    - type: pvc
      name: iot-vlm-db
      mountPath: /app/db
      readOnly: false

