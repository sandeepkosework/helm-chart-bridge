

nameOverride: tenant-app
# Placeholders — every real deployment MUST override tenant.* via a
# per-tenant values file (see examples/). Left unset-looking on purpose so
# an accidental `helm install` without -f fails loudly instead of silently
# reusing another tenant's identity.
tenant:
  id: changeme
  name: changeme
  namespace: changeme
  domain: changeme.qraie.ai
imagePullSecrets:
- ocir-registry
storage:
  createStorageClass: true
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
ingress:
  enabled: true
  className: nginx
  annotations: {}
  tls:
    enabled: false
    secretName: ''
# Vault connection for this tenant's own SecretStore (templates/secretstore.yaml)
# -- one namespaced SecretStore per tenant release, authenticating via
# Kubernetes auth with a namespace-label-selector-bound role, rather than a
# single cluster-wide ClusterSecretStore + static token. This is what lets a
# brand-new tenant namespace authenticate to Vault with zero manual `vault
# write` step beyond the one-time cluster setup (see doc). The Argo CD
# ApplicationSet deploying this chart must stamp `vault.namespaceLabel`'s
# key/value (see below) onto the tenant namespace via
# syncPolicy.managedNamespaceMetadata.labels for the role's selector to match.
vault:
  server: http://vault.vault.svc:8200
  path: secret
  version: v2
  mountPath: kubernetes
  role: qraie-bridge
  namespaceLabel:
    key: qraie-bridge-tenant
    value: "true"
# Three layers of Vault-backed secrets. Every layer is an ExternalSecret
# (templates/externalsecret.yaml) read through this tenant's own SecretStore
# and pulled into pods via envFrom (templates/deployment.yaml), least to
# most specific -- a later layer wins on a key an earlier one also defines:
#   1. tenantcommonSecrets   -- org-wide, same for every tenant
#   2. servicecommonSecrets  -- this tenant's, shared by all its services
#   3. serviceSecrets        -- this tenant's, one per service
# Layers 2 and 3 derive their Vault path from tenant.id automatically, so
# leave remotePath empty: layer 2 reads secret/k8s/<tenant.id>/service-common
# and layer 3 reads secret/k8s/<tenant.id>/<service-name>. Set remotePath
# only to override; it may then use the placeholders <tenant_id> and
# <service-name>, substituted at render time.
#
# 1. Org-wide secrets shared by every tenant (e.g. shared Redis/Mongo host,
# third-party API keys used in common) -- ONE Vault path, ONE K8s Secret
# per tenant namespace, injected into EVERY enabled service automatically.
# NOT tenant-scoped and nothing copies it -- every tenant's ExternalSecret
# reads the exact same Vault path live, so an update here reaches every
# tenant on its next refresh. Populate secret/k8s/tenant-common manually;
# nothing writes to it automatically.
tenantcommonSecrets:
  enabled: true
  secretName: tenant-common-secret
  remotePath: secret/k8s/tenant-common
  refreshInterval: 1m
# 2. Values shared across all of THIS tenant's own services, but not with
# other tenants (e.g. this tenant's own Redis host/password). One K8s
# Secret per tenant, injected into EVERY enabled service automatically.
servicecommonSecrets:
  enabled: true
  secretName: service-common-secret
  remotePath: ""   # default: secret/k8s/<tenant.id>/service-common
  refreshInterval: 1m
# 3. Secrets scoped to a single service of a single tenant: one K8s Secret
# per enabled service (<tenant.id>-<service-name>-<secretName>), injected
# into that service ONLY.
#
# Per service, each layer can be turned off in its services[] entry:
#   secrets:
#     tenantCommon: false    # skip layer 1 for this service
#     serviceCommon: false   # skip layer 2 for this service
#     service: false         # skip layer 3: no ExternalSecret, no Vault path
# A layer is delivered to a service only if it is on BOTH here (the global
# `enabled` of that layer) and in the service's own `secrets:`. An omitted
# flag counts as true.
serviceSecrets:
  enabled: true
  secretName: service-secret
  remotePath: ""   # default: secret/k8s/<tenant.id>/<service-name>
  refreshInterval: 1m
# OCIR pull credentials for the private iad.ocir.io images most services
# above use -- ONE Vault path, same as commonSecrets, read by every tenant's
# own SecretStore and materialized as a kubernetes.io/dockerconfigjson
# Secret literally named `ocirPullSecret.secretName` in that tenant's
# namespace. Referenced by every pod via imagePullSecrets (see values.yaml's
# own `imagePullSecrets` list and templates/deployment.yaml). Populate
# secret/k8s/ocir-pull-secret manually (key: dockerconfigjson, a full
# ~/.docker/config.json-shaped JSON string) -- nothing writes to it
# automatically, same as commonSecrets.
ocirPullSecret:
  enabled: true
  secretName: ocir-regcred
  remotePath: secret/k8s/ocir-pull-secret
  refreshInterval: 1h
persistence:
  bridge-cp-wtl-sr-instances:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  bridge-cp-redis-dispatcher:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  bridge-cp-redis-data:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce        
  redis-data:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  # Dedicated PVCs for qraie-redis-shared/qraie-redis -- deliberately NOT
  # reusing redis-data above, which already belongs to
  # bridge-cp-conductor-redis: two separate Deployments (separate pods)
  # both claiming the same PVC name would fight over one ReadWriteOnce
  # volume, unlike the same PVC being mounted twice within ONE pod (which
  # templates/deployment.yaml already dedupes safely).
  qraie-redis-shared-data:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  qraie-redis-data:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  erep-generated:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  erep-logs:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  qraie-attachments:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  iot-vlm-deepface:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  iot-vlm-db:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  prism-videos:
    enabled: true
    size: 10Gi
    accessModes:
    - ReadWriteOnce
  voxflow-agents:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  voxflow-mcp:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
  radicale-data:
    enabled: true
    size: 5Gi
    accessModes:
    - ReadWriteOnce
# Listing a service's name here disables it regardless of its own
# `enabled: true` in the services[] entry above -- disabledServices always
# wins over a service's own enabled flag, never the other way around.
disabledServices: []
# Per-service image tag overrides, keyed by services[].name -- e.g.
#   imageTags:
#     bridge: v1.4.2
#     qraie-ui: stg-hbssv-20261007
#
# Precedence (highest wins):
#   1. imageTags.<service-name>   -- if set and non-empty, this tag is used
#   2. services[].image.tag       -- the service's own default below
# So `image.tag` in services[] is only a default; an imageTags entry always
# overrides it. An empty ("") or null entry counts as unset and falls back
# to the default. Only the tag can be overridden -- image.repository always
# comes from services[].
#
# This is a map (not a services[] edit) so a tenant values file can pin one
# service's tag without Helm replacing the whole services list. The erep
# Pod template (templates/erep-pod-configmap.yaml) follows erep-server's
# effective tag too.
imageTags: {}
# Where services get their listen port (see each service's `portEnv`).
#
#   chart   (default)  Each name in a service's `portEnv` is set to that
#                      service's first containerPort, in the container's
#                      `env`. That beats the envFrom secrets, so the app
#                      listens on the port the Service/ingress/probes use
#                      even if Vault has a different or empty value.
#   secret             `portEnv` is ignored: the port comes from the
#                      service's Vault-backed secrets, as before.
#
# A service can set its own `portSource:` to override this default. A
# service with no `portEnv` is never touched either way.
portSource: chart
# Global autoscaling master switch. It is checked FIRST; a service's own
# `autoscaling.enabled` (in services[] below) is only looked at if this is on.
#
#   enabled: true             The global switch is "on" and steps aside:
#                              each service's own autoscaling.enabled decides.
#                                service true  -> that service gets an HPA
#                                service false -> that service gets no HPA
#   enabled: false  (default)  The global switch is "off" and wins over every
#                              service: NO HPA is rendered for ANY service,
#                              even one with its own autoscaling.enabled: true.
#                              The per-service settings are kept, just ignored.
#
#   global   service   result
#   true     true      HPA created
#   true     false     no HPA
#   false    true      no HPA   (global wins)
#   false    false     no HPA
#
# Use `false` in a tenant values file to turn autoscaling off for the whole
# tenant without editing services[]. With no HPA, each Deployment runs at its
# own `replicas`. Existing HPAs are removed on sync only if Argo CD pruning is
# enabled; otherwise they stay and keep controlling the replica count.
autoscaling:
  enabled: false
# Autoscaling (per service, `autoscaling:` below) scales on CPU by default.
# Each metric is optional and rendered only if its target is set: add
# `targetMemoryUtilizationPercentage: <n>` to a service to also scale on
# memory (the higher of the two replica counts wins). Memory is off by
# default because most apps hold memory after load, so it rarely scales
# back down. At least one target must be set when autoscaling.enabled.
services:
  - name: qraie-redis-shared
    enabled: true
    # Which secret layers this service receives via envFrom (see the
    # secrets section at the top). Each is on unless set to false here.
    secrets:
      tenantCommon: true    # layer 1 (tenantcommonSecrets)
      serviceCommon: true   # layer 2 (servicecommonSecrets)
      service: true       # layer 3: this service's own secret (serviceSecrets)
    image:
      repository: redis
      tag: '7'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 6379
    # Every other service that talks to this instance sends REDIS_PASSWORD —
    # the real docker-compose enforces it via `redis-server --requirepass`,
    # which the chart never carried over (this Deployment ran with no auth
    # at all). command uses the Kubernetes $(VAR) env-substitution syntax,
    # so REDIS_PASSWORD below must come from the same secret every client
    # already reads, not a separately-managed value.
    command:
    - redis-server
    - --requirepass
    - $(REDIS_PASSWORD)
    env: {}
    # Health checks translated from the docker-compose healthcheck of the same
    # app. Optional `probes:` takes raw Kubernetes probe specs under
    # startupProbe / readinessProbe / livenessProbe. Readiness (and startup)
    # only: a failing check stops traffic to the pod but does not restart it.
    probes:
      readinessProbe:
        exec:
          command:
          - sh
          - -c
          - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
    ingressPath: null
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 1Gi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    persistence:
    - type: pvc
      name: qraie-redis-shared-data
      mountPath: /data
      readOnly: false

