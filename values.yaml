      service: true       # layer 3: this service's own secret (serviceSecrets)
    image:
      repository: iad.ocir.io/hbssoc/mcp_server
      tag: 'stg-acetaxi'
      pullPolicy: IfNotPresent
    replicas: 1
    ports:
    - containerPort: 10011
    env: {}
    # Health checks translated from the docker-compose healthcheck of the same
    # app. Optional `probes:` takes raw Kubernetes probe specs under
    # startupProbe / readinessProbe / livenessProbe. Readiness (and startup)
    # only: a failing check stops traffic to the pod but does not restart it.
    probes:
      startupProbe:        # compose start_period: 30s
        httpGet:
          path: /health
          port: 10011
        periodSeconds: 5
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /health
          port: 10011
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 5
    portEnv:
    - PORT
    - MCP_SERVER_PORT
    - VIRTUAL_PORT
    - API_PORT
    ingressPath: null
    # Shared Redis (qraie-redis-shared): host and port come from the chart,
