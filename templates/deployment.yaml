{{- range $svc := .Values.services }}
{{- $name := $svc.name }}
{{- if eq (include "tenant-app.serviceEnabled" (dict "svc" $svc "disabledServices" $.Values.disabledServices)) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $.Values.tenant.id $name }}
  labels:
    {{- include "tenant-app.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tenant-app.name" $ }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tenant-app.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
        tenant: {{ $.Values.tenant.name | quote }}
    spec:
      serviceAccountName: {{ include "tenant-app.name" $ }}
      imagePullSecrets:
{{- range $.Values.imagePullSecrets }}
        - name: {{ . }}
{{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
{{- if $svc.command }}
          command:
{{ toYaml $svc.command | indent 10 }}
{{- end }}
{{- if $svc.ports }}
          ports:
{{- range $p := $svc.ports }}
            - containerPort: {{ $p.containerPort }}
{{- if $p.name }}
              name: {{ $p.name }}
{{- end }}
{{- end }}
{{- end }}
          envFrom:
            # Three layers, least to most specific -- Kubernetes applies
            # envFrom entries in order and a later one wins on a key both
            # define, so each layer can only be overridden by something
            # more specific than itself, never the other way around.
{{- if $.Values.commonSecrets.enabled }}
            # 1. Org-wide, shared by every tenant (see commonSecrets in
            # values.yaml) -- one Vault path, one secret, read live rather
            # than copied into each service's own secret.
            - secretRef:
                name: {{ printf "%s-%s" $.Values.tenant.id $.Values.commonSecrets.secretName }}
{{- end }}
{{- if $.Values.serviceCommonSecrets.enabled }}
            # 2. Shared by every service of THIS tenant, but not other
            # tenants (see serviceCommonSecrets in values.yaml) -- e.g. this
            # tenant's own shared-Redis password, written once per tenant.
            - secretRef:
                name: {{ printf "%s-%s" $.Values.tenant.id $.Values.serviceCommonSecrets.secretName }}
{{- end }}
            # 3. This service's own path (see
            # vault_service.QRAIE_BRIDGE_SERVICE_KEYS for the schema) --
            # bulk-imported so this template never has to enumerate
            # individual keys per service. Most specific of the three
            # envFrom layers, so it wins over both above for any key they
            # share -- but $svc.env below (rendered as real env[] entries,
            # not just documentation) wins over this too, per Kubernetes'
            # own env[]-over-envFrom precedence.
            - secretRef:
                name: {{ printf "%s-%s-secret" $.Values.tenant.id $name }}
{{- $usesSharedRedis := has $name $.Values.redisSharedServices }}
{{- $ownRedisTarget := get $.Values.redisOwnServices $name }}
{{- if or (not (hasKey $svc.env "TENANT_ID")) $svc.env $svc.plainEnv $usesSharedRedis $ownRedisTarget }}
          env:
{{- if not (hasKey $svc.env "TENANT_ID") }}
            # Reference example: an explicit secretKeyRef for one key,
            # rather than pulling in the whole secret via envFrom above --
            # the pattern to reach for if a service ever needs just one
            # key without the rest.
            - name: TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-%s-secret" $.Values.tenant.id $name }}
                  key: TENANT_ID
{{- end }}
{{- range $key, $value := $svc.plainEnv }}
            # Reference example: a non-secret value sourced directly from
            # this chart's values.yaml -- edit it here via a normal PR
            # instead of a Vault CLI command. Only appropriate for values
            # that genuinely aren't sensitive.
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- range $key, $value := $svc.env }}
            # Explicit override from this service's own `env:` block in
            # values.yaml -- rendered LAST, so it wins over plainEnv above
            # too if they ever define the same key (Kubernetes resolves
            # duplicate env[] names by last-one-wins), in addition to
            # already winning over anything envFrom pulled in from Vault.
            # Whatever is set here always reaches the container.
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- if $usesSharedRedis }}
            # Computed directly, not sourced from Vault -- fully
            # deterministic from this tenant's own slug, same naming
            # qraie-redis-shared's own Service object uses (see
            # tenant-app.slug + service.yaml). REDIS_PASSWORD still comes
            # from serviceCommonSecrets via envFrom above.
            - name: REDIS_HOST
              value: {{ printf "%s-qraie-redis-shared" (include "tenant-app.slug" $) | quote }}
            - name: REDIS_PORT
              value: "6379"
{{- end }}
{{- if $ownRedisTarget }}
            # This service talks to its own dedicated Redis sibling, not
            # the shared qraie-redis-shared instance (see
            # redisOwnServices in values.yaml) -- also computed directly,
            # same reasoning as $usesSharedRedis above.
            - name: REDIS_HOST
              value: {{ printf "%s-%s" (include "tenant-app.slug" $) $ownRedisTarget | quote }}
            - name: REDIS_PORT
              value: "6379"
{{- end }}
{{- end }}
          resources:
{{ toYaml $svc.resources | indent 12 }}
{{- if $svc.persistence }}
          volumeMounts:
{{- range $v := $svc.persistence }}
{{- $volKey := $v.name }}
{{- if eq $v.type "hostPath" }}
{{- $volKey = ($v.path | replace "/" "-" | replace "." "-" | trimAll "-") }}
{{- end }}
            - name: {{ printf "%s-%s" $name $volKey | trunc 63 | trimSuffix "-" }}
              mountPath: {{ $v.mountPath }}
              readOnly: {{ default false $v.readOnly }}
{{- end }}
{{- end }}
{{- if $svc.persistence }}
      volumes:
{{- $seenVolumes := dict }}
{{- range $v := $svc.persistence }}
{{- $volKey := $v.name }}
{{- if eq $v.type "hostPath" }}
{{- $volKey = ($v.path | replace "/" "-" | replace "." "-" | trimAll "-") }}
{{- end }}
{{- $volName := printf "%s-%s" $name $volKey | trunc 63 | trimSuffix "-" }}
{{- if not (hasKey $seenVolumes $volName) }}
{{- $_ := set $seenVolumes $volName true }}
        - name: {{ $volName }}
{{- if eq $v.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-%s-pvc" $.Values.tenant.id $v.name }}
{{- else if eq $v.type "hostPath" }}
          hostPath:
            path: {{ $v.path }}
            type: DirectoryOrCreate
{{- else }}
          configMap:
            name: {{ $v.name }}
            optional: true
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
{{- end }}
{{- end }}
