{{- range $svc := .Values.services }}
{{- $name := $svc.name }}
{{- $portSource := default $.Values.portSource $svc.portSource | default "chart" }}
{{- if not (has $portSource (list "chart" "secret")) }}{{- fail (printf "service %q: portSource must be chart or secret, got %q" $name $portSource) }}{{- end }}
{{- $portEnv := ternary (default (list) $svc.portEnv) (list) (eq $portSource "chart") }}
{{- $ownSecret := eq (include "tenant-app.serviceSecretEnabled" (dict "root" $ "svc" $svc)) "true" }}
{{- if eq (include "tenant-app.serviceEnabled" (dict "svc" $svc "disabledServices" $.Values.disabledServices)) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $.Values.tenant.id $name }}
  labels:
    {{- include "tenant-app.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tenant-app.name" $ }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tenant-app.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
        tenant: {{ $.Values.tenant.name | quote }}
    spec:
      serviceAccountName: {{ include "tenant-app.name" $ }}
      imagePullSecrets:
{{- range $.Values.imagePullSecrets }}
        - name: {{ . }}
{{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ include "tenant-app.imageTag" (dict "svc" $svc "imageTags" $.Values.imageTags) }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
{{- if $svc.command }}
          command:
{{ toYaml $svc.command | indent 10 }}
{{- end }}
{{- if $svc.ports }}
          ports:
{{- range $p := $svc.ports }}
            - containerPort: {{ $p.containerPort }}
{{- if $p.name }}
              name: {{ $p.name }}
{{- end }}
{{- end }}
{{- end }}
          envFrom:
            # Three layers, least to most specific -- Kubernetes applies
            # envFrom entries in order and a later one wins on a key both
            # define (see the secrets section of values.yaml).
{{- if eq (include "tenant-app.sharedSecretEnabled" (dict "root" $ "svc" $svc "layer" "tenantCommon")) "true" }}
            # 1. Org-wide, same for every tenant, added to every service.
            - secretRef:
                name: {{ printf "%s-%s" $.Values.tenant.id $.Values.tenantcommonSecrets.secretName }}
{{- end }}
{{- if eq (include "tenant-app.sharedSecretEnabled" (dict "root" $ "svc" $svc "layer" "serviceCommon")) "true" }}
            # 2. This tenant's, shared by all its services, added to every service.
            - secretRef:
                name: {{ printf "%s-%s" $.Values.tenant.id $.Values.servicecommonSecrets.secretName }}
{{- end }}
{{- if $ownSecret }}
            # 3. This service's own secret, added to this service only.
            - secretRef:
                name: {{ include "tenant-app.serviceSecretName" (dict "root" $ "service" $name) }}
{{- end }}
{{- if or (and $ownSecret (not (hasKey $svc.env "TENANT_ID"))) $svc.plainEnv $svc.serviceRefEnv $portEnv }}
          env:
{{- if and $ownSecret (not (hasKey $svc.env "TENANT_ID")) }}
            # Reference example: an explicit secretKeyRef for one key,
            # rather than pulling in the whole secret via envFrom above.
            - name: TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "tenant-app.serviceSecretName" (dict "root" $ "service" $name) }}
                  key: TENANT_ID
{{- end }}
{{- range $key, $ref := $svc.serviceRefEnv }}
{{- $target := dict }}
{{- range $.Values.services }}{{- if eq .name $ref.service }}{{- $target = . }}{{- end }}{{- end }}
{{- if not $target }}{{- fail (printf "service %q: serviceRefEnv.%s refers to unknown service %q" $name $key $ref.service) }}{{- end }}
{{- if ne (include "tenant-app.serviceEnabled" (dict "svc" $target "disabledServices" $.Values.disabledServices)) "true" }}{{- fail (printf "service %q: serviceRefEnv.%s refers to disabled service %q" $name $key $ref.service) }}{{- end }}
            # Looked up from the other service in this chart, not from Vault:
            # its in-cluster Service name / first port. Set in `env`, which
            # takes precedence over the envFrom secrets above.
            - name: {{ $key }}
              value: {{ if eq $ref.field "host" }}{{ printf "%s-%s" (include "tenant-app.slug" $) $target.name | quote }}{{ else if eq $ref.field "port" }}{{ (index $target.ports 0).containerPort | toString | quote }}{{ else }}{{ fail (printf "service %q: serviceRefEnv.%s field must be host or port" $name $key) }}{{ end }}
{{- end }}
{{- range $key, $value := $svc.plainEnv }}
            # Reference example: a non-secret value sourced directly from
            # this chart's values.yaml. Only for values that aren't sensitive.
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- range $key := $portEnv }}
{{- if not (hasKey (default (dict) $svc.plainEnv) $key) }}
            # The port this app listens on, set from the first containerPort
            # so it can't drift from the Service/ingress/probes and isn't
            # left empty by an unfilled Vault key. In `env`, so it wins over
            # the envFrom secrets.
            - name: {{ $key }}
              value: {{ (index $svc.ports 0).containerPort | toString | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- range $probeKey := list "startupProbe" "readinessProbe" "livenessProbe" }}
{{- with get (default (dict) $svc.probes) $probeKey }}
          {{ $probeKey }}:
{{ toYaml . | indent 12 }}
{{- end }}
{{- end }}
          resources:
{{ toYaml $svc.resources | indent 12 }}
{{- if $svc.persistence }}
          volumeMounts:
{{- range $v := $svc.persistence }}
{{- $volKey := $v.name }}
{{- if eq $v.type "hostPath" }}
{{- $volKey = ($v.path | replace "/" "-" | replace "." "-" | trimAll "-") }}
{{- end }}
            - name: {{ printf "%s-%s" $name $volKey | trunc 63 | trimSuffix "-" }}
              mountPath: {{ $v.mountPath }}
              readOnly: {{ default false $v.readOnly }}
{{- end }}
{{- end }}
{{- if $svc.persistence }}
      volumes:
{{- $seenVolumes := dict }}
{{- range $v := $svc.persistence }}
{{- $volKey := $v.name }}
{{- if eq $v.type "hostPath" }}
{{- $volKey = ($v.path | replace "/" "-" | replace "." "-" | trimAll "-") }}
{{- end }}
{{- $volName := printf "%s-%s" $name $volKey | trunc 63 | trimSuffix "-" }}
{{- if not (hasKey $seenVolumes $volName) }}
{{- $_ := set $seenVolumes $volName true }}
        - name: {{ $volName }}
{{- if eq $v.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-%s-pvc" $.Values.tenant.id $v.name }}
{{- else if eq $v.type "hostPath" }}
          hostPath:
            path: {{ $v.path }}
            type: DirectoryOrCreate
{{- else }}
          configMap:
            name: {{ $v.name }}
            optional: true
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
{{- end }}
{{- end }}
