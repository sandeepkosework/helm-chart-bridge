# One namespaced SecretStore per tenant release, authenticating to Vault via
# Kubernetes auth as this chart's own ServiceAccount (see serviceaccount.yaml)
# in this tenant's own namespace. Vault's Kubernetes-auth role
# (.Values.vault.role) is bound via bound_service_account_namespace_selector
# to .Values.vault.namespaceLabel, not a hand-listed namespace -- so a brand
# new tenant authenticates with zero manual `vault write` step, as long as
# the Argo CD ApplicationSet deploying this chart stamps that label onto the
# namespace it creates (syncPolicy.managedNamespaceMetadata.labels).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "tenant-app.name" . }}-vault
  labels:
    {{- include "tenant-app.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server }}
      path: {{ .Values.vault.path }}
      version: {{ .Values.vault.version }}
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.mountPath }}
          role: {{ .Values.vault.role }}
          serviceAccountRef:
            name: {{ include "tenant-app.name" . }}
