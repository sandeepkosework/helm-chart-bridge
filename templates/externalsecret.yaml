{{- if .Values.commonSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" .Values.tenant.id .Values.commonSecrets.secretName }}
spec:
  refreshInterval: {{ .Values.commonSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.commonSecrets.secretStoreRef.name }}
    kind: {{ .Values.commonSecrets.secretStoreRef.kind }}
  target:
    name: {{ printf "%s-%s" .Values.tenant.id .Values.commonSecrets.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.commonSecrets.remotePath | quote }}
---
{{- end }}
{{- if .Values.tenantSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" .Values.tenant.id .Values.tenantSecrets.secretName }}
spec:
  refreshInterval: {{ .Values.tenantSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.tenantSecrets.secretStoreRef.name }}
    kind: {{ .Values.tenantSecrets.secretStoreRef.kind }}
  target:
    name: {{ printf "%s-%s" .Values.tenant.id .Values.tenantSecrets.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.tenantSecrets.remotePath | default (printf "secret/tenants/%s" .Values.tenant.id) | quote }}
---
{{- end }}
{{- if .Values.serviceSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s-secret" $.Values.tenant.id $name }}
spec:
  refreshInterval: {{ $.Values.serviceSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.serviceSecrets.secretStoreRef.name }}
    kind: {{ $.Values.serviceSecrets.secretStoreRef.kind }}
  target:
    name: {{ printf "%s-%s-secret" $.Values.tenant.id $name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" ($.Values.serviceSecrets.remotePathPrefix | default (printf "secret/tenants/%s" $.Values.tenant.id)) $name | quote }}
---
{{- end }}
{{- end }}
{{- end }}
