# OCIR image-pull credentials, materialized as a real kubernetes.io/
# dockerconfigjson Secret in this tenant's own namespace so every pod's
# imagePullSecrets reference (see values.yaml) actually resolves. Same
# pattern as tenantcommonSecrets: one shared Vault path, read live by every
# tenant's own SecretStore -- nothing tenant-specific here, and nothing
# copies/duplicates the credential per tenant.
{{- if .Values.ocirPullSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.ocirPullSecret.secretName }}
  labels:
    {{- include "tenant-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.ocirPullSecret.refreshInterval }}
  secretStoreRef:
    name: {{ include "tenant-app.name" . }}-vault
    kind: SecretStore
  target:
    name: {{ .Values.ocirPullSecret.secretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ "{{ .dockerconfigjson }}" }}'
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ .Values.ocirPullSecret.remotePath | quote }}
        property: dockerconfigjson
{{- end }}
