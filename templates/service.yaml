{{- range $svc := .Values.services }}
{{- $name := $svc.name }}
{{- if and (eq (include "tenant-app.serviceEnabled" (dict "svc" $svc "disabledServices" $.Values.disabledServices)) "true") $svc.ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" (include "tenant-app.slug" $) $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "tenant-app.name" $ }}
    app.kubernetes.io/component: {{ $name }}
  ports:
{{- range $p := $svc.ports }}
    - name: {{ $p.name }}
      port: {{ $p.containerPort }}
      targetPort: {{ $p.containerPort }}
      protocol: TCP
{{- end }}
---
{{- end }}
{{- end }}
