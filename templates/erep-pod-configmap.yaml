{{- /*
Templates for the Pod and Service that erep-server creates for each erep, replacing the
sibling container it used to start through docker.sock (`docker run`). Shipped as a ConfigMap
(keys: erep-pod.yaml, erep-service.yaml), mounted into erep-server at /etc/erep-pod-template
via its own configMap-type persistence entry in values.yaml. erep-server reads the manifests
and POSTs them to the Kubernetes API with its own ServiceAccount token (see rbac.yaml).

erep-server fills in, per erep:
  metadata.name     the container name it already uses (both the Pod and the Service)
  label `erep`      the same name, which is what the Service selects on
  containers[0].env the variables it used to pass with `docker run -e`
  the Service port  the erep's port (what erep-server puts in http://<name>:<port>); it
                    forwards to the template's container port

The image is the erep-template image (values.yaml `erepTemplate.image`), not erep-server's
own. Nothing here needs a volume: the erep-template image keeps no state, so the Pod does
not mount the PVCs erep-server uses (they are ReadWriteOnce).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: erep-pod-template
  labels:
    {{- include "tenant-app.labels" . | nindent 4 }}
data:
  erep-pod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "tenant-app.labels" . | nindent 8 }}
        app: erep
    spec:
      # An erep makes no Kubernetes API calls, so it gets no ServiceAccount token.
      automountServiceAccountToken: false
      {{- if .Values.hostAliasIp }}
      hostAliases:
        - ip: {{ .Values.hostAliasIp | quote }}
          hostnames:
            - {{ .Values.tenant.domain | quote }}
      {{- end }}
      restartPolicy: Always
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: erep
          image: {{ .Values.erepTemplate.image | quote }}
          ports:
            - containerPort: {{ .Values.erepTemplate.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.erepTemplate.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.erepTemplate.port }}
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.erepTemplate.resources | nindent 12 }}
  erep-service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "tenant-app.labels" . | nindent 8 }}
        app: erep
    spec:
      type: ClusterIP
      ports:
        - port: 0   # erep-server sets the erep's port
          targetPort: {{ .Values.erepTemplate.port }}
      # erep-server sets `selector: {erep: <name>}` -- matching the `erep` label it puts on the
      # Pod -- so a Service reaches only its own erep. Left out here on purpose: a selector of
      # just `app: erep` would spread traffic across every erep in the namespace.
